# GitHub Pages 미리보기 배포
# ------------------------------------------------------------
# 화면 확인용 정적 사이트를 GitHub Pages 에 올린다. (운영 배포와 무관)
# 관리자 화면 · API · 견적 접수 · 시공사례 DB 조회 등 서버 기능은 포함되지 않는다.
# 자세한 내용: scripts/static-preview.mjs
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'nbh0000/clearcheolgeo-preview'
    runs-on: ubuntu-latest
    env:
      STATIC_PREVIEW: '1'
      NEXT_PUBLIC_STATIC_PREVIEW: '1'
      NEXT_PUBLIC_SHOW_SAMPLE_PROJECTS: '1'
      PREVIEW_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 서버 전용 영역 제거 · 정적 자산 경로 조정
        run: node scripts/static-preview.mjs .
      - name: 정적 빌드
        run: npx next build
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.repository == 'nbh0000/clearcheolgeo-preview'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
